name: Publish qualified OpenWrt runtime release

on:
  workflow_run:
    workflows: [OpenWrt package qualification]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful OpenWrt package qualification run ID
        required: true
        type: string
      qualification_head_sha:
        description: Exact head SHA of that qualification run
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: rill-runtime-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          name: qualification-evidence
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          pattern: rill-runtime-ipk-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          pattern: rill-runtime-apk-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact qualification run and release assets
        id: release
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.qualification_head_sha }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          evidence=$(find evidence -type f -name qualification.json -print -quit)
          test -n "$evidence"
          jq -e --arg sha "$HEAD_SHA" --arg run "$RUN_ID" \
            '.schemaVersion == 2 and .packageCommit == $sha and .runId == $run and .qualificationState == "automated-qualification" and .releaseEligible == true and (.targets|length) > 0 and all(.targets[]; .qualificationState == "PASS")' \
            "$evidence" >/dev/null
          version=$(jq -r '.package.version' "$evidence")
          release=$(jq -r '.package.release' "$evidence")
          tag="v${version}-r${release}"
          test "$(jq -r '.upstream.tag' metadata/rill-runtime.json)" = "v${version}"
          test "$(jq -r '.upstream.commit' metadata/rill-runtime.json)" = "$(jq -r '.upstream.commit' "$evidence")"
          mapfile -t assets < <(find release-assets -maxdepth 2 -type f \( -name '*.ipk' -o -name '*.apk' \) -print | sort)
          target_count=$(jq '.targets | length' "$evidence")
          test "${#assets[@]}" -eq "$target_count"
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          new_sums=$(cd release-assets && sha256sum -- *.ipk *.apk | sort)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            existing_dir="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing_dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern qualification.json --pattern '*.ipk' --pattern '*.apk' --dir "$existing_dir"
            diff -u <(sort "$existing_dir/SHA256SUMS") <(printf '%s\n' "$new_sums")
            diff -u <(jq -S . "$existing_dir/qualification.json") <(jq -S . "$evidence")
            existing_assets=$(find "$existing_dir" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -printf '%f\n' | sort)
            new_assets=$(printf '%s\n' "${assets[@]}" | xargs -n1 basename | sort)
            diff -u <(printf '%s\n' "$existing_assets") <(printf '%s\n' "$new_assets")
            echo "Existing immutable release $tag has identical package hashes; promotion is a no-op."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$evidence" release-assets/qualification.json
          printf '%s\n' "$new_sums" > release-assets/SHA256SUMS
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "release=$release"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
      - name: Publish immutable package release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE: ${{ steps.release.outputs.release }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/*.ipk release-assets/*.apk release-assets/SHA256SUMS release-assets/qualification.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "rill-runtime $TAG" \
            --notes "Promoted from exact OpenWrt qualification run ${RUN_ID} for package ${VERSION}-${RELEASE}. Assets and qualification.json are from that same successful run; no release rebuild was performed."
