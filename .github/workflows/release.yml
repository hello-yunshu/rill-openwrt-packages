name: Publish qualified OpenWrt runtime release

on:
  workflow_run:
    workflows: [OpenWrt package qualification]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful OpenWrt package qualification run ID
        required: true
        type: string
      qualification_run_attempt:
        description: Exact successful qualification attempt
        required: true
        type: number
      qualification_head_sha:
        description: Exact head SHA of that qualification run
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: rill-runtime-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.qualification_head_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          name: qualification-evidence-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.qualification_run_attempt }}
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          pattern: rill-runtime-ipk-*-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.qualification_run_attempt }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          pattern: rill-runtime-apk-*-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.qualification_run_attempt }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          pattern: rill-runtime-preview-*-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.qualification_run_attempt }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          name: rill-openwrt-signing-tools-apk-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.qualification_run_attempt }}
          path: tools-archives
      - name: Prepare official APK inspector
        run: |
          mkdir -p tools
          tar -xzf tools-archives/signing-tools-apk.tar.gz -C tools
          chmod +x tools/bin/apk tools/bin/.apk.bin tools/lib/ld-linux-x86-64.so.2
      - name: Verify exact qualification run and release assets
        id: release
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.qualification_head_sha }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
          RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.qualification_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence=$(find evidence -type f -name qualification.json -print -quit)
          test -n "$evidence"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          actual_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT")
          jq -e --arg sha "$HEAD_SHA" --argjson attempt "$RUN_ATTEMPT" \
            '.head_sha==$sha and .run_attempt==$attempt and .status=="completed" and .conclusion=="success" and .path==".github/workflows/qualify.yml"' <<<"$actual_run"
          jq -e --arg sha "$HEAD_SHA" --argjson run "$RUN_ID" --argjson attempt "$RUN_ATTEMPT" \
            '.schemaVersion==3 and .packageCommit==$sha and .runId==$run and .runAttempt==$attempt' "$evidence"
          python3 scripts/verify_qualification.py "$evidence" --channel preview \
            --package-commit "$HEAD_SHA" --artifacts-dir release-assets --apk "$PWD/tools/bin/apk"
          version=$(jq -r '.package.version' "$evidence")
          release=$(jq -r '.package.release' "$evidence")
          tag="v${version}-r${release}"
          test "$(jq -r '.upstream.tag' metadata/rill-runtime.json)" = "v${version}"
          test "$(jq -r '.upstream.commit' metadata/rill-runtime.json)" = "$(jq -r '.upstream.commit' "$evidence")"
          mapfile -t assets < <(find release-assets -maxdepth 2 -type f \( -name '*.ipk' -o -name '*.apk' \) -print | sort)
          target_count=$(jq '(.targets|length)+(.previewPackage.targets|length)' "$evidence")
          test "${#assets[@]}" -eq "$target_count"
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          mkdir -p evidence/target-records
          find release-assets -maxdepth 1 -type f -name 'target-qualification-*.json' -exec mv -- {} evidence/target-records/ \;
          find release-assets -maxdepth 1 -type f -name 'security-audit-*' -exec mv -- {} evidence/target-records/ \;
          new_sums=$(cd release-assets && sha256sum -- *.ipk *.apk | sort)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            existing_dir="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing_dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern qualification.json --pattern '*.ipk' --pattern '*.apk' --dir "$existing_dir"
            python3 scripts/release_identity.py \
              --existing-dir "$existing_dir" \
              --evidence "$evidence" \
              --assets-dir release-assets
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$evidence" release-assets/qualification.json
          printf '%s\n' "$new_sums" > release-assets/SHA256SUMS
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "release=$release"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
      - name: Publish immutable package release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE: ${{ steps.release.outputs.release }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/*.ipk release-assets/*.apk release-assets/SHA256SUMS release-assets/qualification.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "rill-runtime $TAG" \
            --notes "Promoted from exact OpenWrt qualification run ${RUN_ID} for package ${VERSION}-${RELEASE}. Assets and qualification.json are from that same successful run; no release rebuild was performed."
