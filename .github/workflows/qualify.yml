name: OpenWrt package qualification

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'scripts/**'
      - 'metadata/**'
      - '.github/workflows/qualify.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rill-openwrt-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-registry:
    name: Validate OpenWrt target registry
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: registry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_target_registry
          echo "matrix=$(python3 scripts/openwrt_targets.py --matrix)" >> "$GITHUB_OUTPUT"

  upstream-version-sync:
    name: Upstream Stable version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require latest published Rill Stable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_upstream_version.py --json | tee "$RUNNER_TEMP/upstream-version.json"
          jq -e '.inSync == true' "$RUNNER_TEMP/upstream-version.json"
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    name: ${{ matrix.pkgtype }} OpenWrt ${{ matrix.branch }} ${{ matrix.package_arch }}
    needs: target-registry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.target-registry.outputs.matrix) }}
      # Entries are generated from metadata/openwrt-targets.json.
      # Keep the registry as the only target identity source.
    steps:
      - uses: actions/checkout@v7
      - name: Install SDK host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential file gawk gettext libncurses-dev libssl-dev python3 rsync unzip wget zstd
      - name: Resolve official SDK identity
        id: openwrt-sdk
        shell: bash
        env:
          OPENWRT_TARGET: ${{ matrix.openwrt_target }}
          OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
          SDK_PREFIX: ${{ matrix.sdk_prefix }}
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${{ matrix.release_version }}/targets/$OPENWRT_TARGET/$OPENWRT_SUBTARGET"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 120 "$base/" -o "$RUNNER_TEMP/sdk-index.html"
          sdk=$(grep -oE 'openwrt-sdk-${{ matrix.release_version }}-[^"< ]+[.]tar[.]zst' "$RUNNER_TEMP/sdk-index.html" | grep -m1 -F "${SDK_PREFIX}_")
          test -n "$sdk"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 120 "$base/sha256sums" -o "$RUNNER_TEMP/sdk-sha256sums"
          sdk_archive_sha=$(awk -v f="*$sdk" '$2==f {print $1}' "$RUNNER_TEMP/sdk-sha256sums")
          [[ "$sdk_archive_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "SDK_BASE=$base"
            echo "SDK_ARCHIVE_NAME=$sdk"
            echo "SDK_ARCHIVE_SHA256=$sdk_archive_sha"
          } >> "$GITHUB_ENV"
          echo "filename=$sdk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sdk_archive_sha" >> "$GITHUB_OUTPUT"
      - name: Download and verify official SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$SDK_ARCHIVE_NAME"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 30 --max-time 600 "$SDK_BASE/$SDK_ARCHIVE_NAME" -o "$archive"
          printf '%s *%s\n' "$SDK_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/openwrt-sdk"
          sdkdir=$(find "$RUNNER_TEMP/openwrt-sdk" -maxdepth 1 -type d -name "openwrt-sdk-${{ matrix.release_version }}-${{ matrix.sdk_prefix }}_*" -print -quit)
          test -n "$sdkdir"
          echo "SDKDIR=$sdkdir" >> "$GITHUB_ENV"
      - name: Cache OpenWrt downloads, Rust toolchain, Cargo and build output
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.SDKDIR }}/dl
            ${{ runner.temp }}/rustup
            ${{ runner.temp }}/cargo
            ${{ env.SDKDIR }}/build_dir/target-*/rill-ml-*/target
          key: rill-openwrt-build-${{ runner.os }}-${{ matrix.branch }}-${{ matrix.package_arch }}-${{ hashFiles('package/rill-runtime/Makefile', 'package/rill-runtime-preview/Makefile', 'scripts/prepare_rust_toolchain.sh', 'scripts/stage_rust_toolchain.sh') }}
          restore-keys: |
            rill-openwrt-build-${{ runner.os }}-${{ matrix.branch }}-${{ matrix.package_arch }}-
      - name: Prepare SDK and build package
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          ./scripts/feeds update base packages
          ./scripts/feeds install rust
          mkdir -p package/rill-runtime
          cp -a "$GITHUB_WORKSPACE/package/rill-runtime/." package/rill-runtime/
          mkdir -p package/rill-runtime-preview
          cp -a "$GITHUB_WORKSPACE/package/rill-runtime-preview/." package/rill-runtime-preview/
          echo 'CONFIG_PACKAGE_rill-runtime=y' >> .config
          echo 'CONFIG_PACKAGE_rill-runtime-preview=y' >> .config
          make defconfig
          staging_dir=$(make -s val.STAGING_DIR)
          test -n "$staging_dir"
          rust_staging_dir="$staging_dir/host"
          RUST_TARGET="${{ matrix.rust_target }}" RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo" RUST_STAGING_DIR="$rust_staging_dir" \
            "$GITHUB_WORKSPACE/scripts/prepare_rust_toolchain.sh"
          export PATH="$rust_staging_dir/bin:$PATH"
          export RUSTC="$rust_staging_dir/bin/rustc"
          test "$(command -v cargo)" = "$rust_staging_dir/bin/cargo"
          test "$(command -v rustc)" = "$rust_staging_dir/bin/rustc"
          rustc --version
          [[ "$(rustc --version)" == 'rustc 1.94.0 '* ]]
          unset CI
          target=package/rill-runtime/compile
          jobs="$(($(nproc)+1))"
          if make -j"$jobs" "$target" && make -j"$jobs" package/rill-runtime-preview/compile; then
            exit 0
          else
            fast_rc=$?
          fi
          echo "::error::Fast parallel OpenWrt build failed: $target"
          echo "::group::OpenWrt config at fast-build failure"
          if [ -f .config ]; then cat .config; fi
          echo "::endgroup::"
          echo "::group::Serial verbose diagnostic: $target"
          if make -j1 "$target" V=s; then
            diagnostic_rc=0
          else
            diagnostic_rc=$?
          fi
          echo "Serial diagnostic exit code: $diagnostic_rc"
          echo "::endgroup::"
          exit "$fast_rc"
      - name: Inspect exact package payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          files=$(find bin -type f -name "rill-runtime_[0-9]*.${{ matrix.pkgtype }}")
          test -n "$files"
          preview_file=$(find bin -type f -name "rill-runtime-preview*.${{ matrix.pkgtype }}" -print -quit)
          test -n "$preview_file"
          expected_version=$(sed -n 's/^PKG_VERSION:=//p' "$GITHUB_WORKSPACE/package/rill-runtime/Makefile")
          expected_release=$(sed -n 's/^PKG_RELEASE:=//p' "$GITHUB_WORKSPACE/package/rill-runtime/Makefile")
          preview_release=$(sed -n 's/^PKG_RELEASE:=//p' "$GITHUB_WORKSPACE/package/rill-runtime-preview/Makefile")
          extract_tar_member_archive() {
            local archive="$1" destination="$2"
            mkdir -p "$destination"
            case "$archive" in
              *.tar.gz|*.tgz) tar -xzf "$archive" -C "$destination" ;;
              *.tar.xz|*.txz) tar -xJf "$archive" -C "$destination" ;;
              *.tar.zst|*.tzst) tar --zstd -xf "$archive" -C "$destination" ;;
              *.tar.bz2|*.tbz2) tar -xjf "$archive" -C "$destination" ;;
              *.tar) tar -xf "$archive" -C "$destination" ;;
              *) tar -xf "$archive" -C "$destination" ;;
            esac
          }
          printf '%s\n' "$files" | while IFS= read -r file; do
            case "${file##*.}" in
              ipk)
                package_dir=$(mktemp -d "$RUNNER_TEMP/rill-ipk.XXXXXX")
                trap 'rm -rf "$package_dir"' RETURN
                tar -xf "$file" -C "$package_dir"
                data=$(find "$package_dir" -maxdepth 1 -type f -name 'data.tar.*' -print -quit)
                control=$(find "$package_dir" -maxdepth 1 -type f -name 'control.tar.*' -print -quit)
                test -n "$data"
                test -n "$control"
                control_dir="$package_dir/control"
                data_dir="$package_dir/data"
                extract_tar_member_archive "$control" "$control_dir"
                extract_tar_member_archive "$data" "$data_dir"
                control_file=$(find "$control_dir" -type f -name control -print -quit)
                test -n "$control_file"
                control_text=$(cat "$control_file")
                grep -E '^(Package|Version|Architecture): ' "$control_file"
                grep -Fx 'Package: rill-runtime' <<<"$control_text"
                grep -Eq "^Version: ${expected_version}-r?${expected_release}$" <<<"$control_text"
                grep -Fx 'Architecture: ${{ matrix.package_arch }}' <<<"$control_text"
                find "$data_dir" -type f -o -type l | sed "s#^$data_dir/##; s#^\./##" | grep -Fx usr/bin/rill-runtime
                ! find "$data_dir" -type f -o -type l | sed "s#^$data_dir/##; s#^\./##" | grep -Eq '(^|/)rill-pack$|(^|/)rill-pack/'
                readelf -h "$data_dir/usr/bin/rill-runtime" | grep -Fx '  Class:                             ELF64'
                readelf -h "$data_dir/usr/bin/rill-runtime" | grep -F "  Data:                              2's complement, little endian"
                readelf -h "$data_dir/usr/bin/rill-runtime" | grep -Fx '  Machine:                           ${{ matrix.elf_machine }}'
                rm -rf "$package_dir"
                trap - RETURN
                ;;
              apk)
                test -x "$SDKDIR/staging_dir/host/bin/apk"
                apk_file=$(realpath "$file")
                test -f "$apk_file"
                package_dump=$("$SDKDIR/staging_dir/host/bin/apk" --allow-untrusted adbdump --format json "$apk_file")
                test -n "$package_dump"
                jq -e type <<<"$package_dump" >/dev/null
                test "$(basename "$file")" = "rill-runtime_${expected_version}-r${expected_release}_${{ matrix.package_arch }}.apk"
                extract_dir=$(mktemp -d "$RUNNER_TEMP/rill-apk.XXXXXX")
                "$SDKDIR/staging_dir/host/bin/apk" --allow-untrusted extract --destination "$extract_dir" "$apk_file"
                test -x "$extract_dir/usr/bin/rill-runtime"
                ! find "$extract_dir" -type f -o -type l | sed "s#^$extract_dir/##; s#^\./##" | grep -Eq '(^|/)rill-pack$|(^|/)rill-pack/'
                readelf -h "$extract_dir/usr/bin/rill-runtime" | grep -F 'Class:                             ELF64'
                readelf -h "$extract_dir/usr/bin/rill-runtime" | grep -F "Data:                              2's complement, little endian"
                readelf -h "$extract_dir/usr/bin/rill-runtime" | grep -F 'Machine:                           ${{ matrix.elf_machine }}'
                rm -rf "$extract_dir"
                ;;
          esac
          done
          case "${{ matrix.pkgtype }}" in
            ipk)
              preview_dir=$(mktemp -d "$RUNNER_TEMP/rill-preview-ipk.XXXXXX")
              tar -xf "$preview_file" -C "$preview_dir"
              preview_control=$(find "$preview_dir" -maxdepth 1 -name 'control.tar.*' -print -quit)
              preview_data=$(find "$preview_dir" -maxdepth 1 -name 'data.tar.*' -print -quit)
              test -n "$preview_control"; test -n "$preview_data"
              extract_tar_member_archive "$preview_control" "$preview_dir/control"
              extract_tar_member_archive "$preview_data" "$preview_dir/data"
              grep -Fx 'Package: rill-runtime-preview' "$preview_dir/control/control"
              test -x "$preview_dir/data/usr/bin/rill-runtime"
              rm -rf "$preview_dir"
              ;;
            apk)
              preview_dump=$("$SDKDIR/staging_dir/host/bin/apk" --allow-untrusted adbdump --format json "$(realpath "$preview_file")")
              jq -e type <<<"$preview_dump" >/dev/null
              test "$(basename "$preview_file")" = "rill-runtime-preview_${expected_version}-r${preview_release}_${{ matrix.package_arch }}.apk"
              preview_extract_dir=$(mktemp -d "$RUNNER_TEMP/rill-preview-apk.XXXXXX")
              "$SDKDIR/staging_dir/host/bin/apk" --allow-untrusted extract --destination "$preview_extract_dir" "$(realpath "$preview_file")"
              test -x "$preview_extract_dir/usr/bin/rill-runtime"
              ! find "$preview_extract_dir" -type f -o -type l | sed "s#^$preview_extract_dir/##; s#^\./##" | grep -Eq '(^|/)rill-pack$|(^|/)rill-pack/'
              readelf -h "$preview_extract_dir/usr/bin/rill-runtime" | grep -F 'Class:                             ELF64'
              readelf -h "$preview_extract_dir/usr/bin/rill-runtime" | grep -F "Data:                              2's complement, little endian"
              readelf -h "$preview_extract_dir/usr/bin/rill-runtime" | grep -F 'Machine:                           ${{ matrix.elf_machine }}'
              rm -rf "$preview_extract_dir"
              ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/preview-output"
          printf '%s\n' "$files" | while IFS= read -r file; do
            release_file="rill-runtime-${{ matrix.branch }}-${{ matrix.package_arch }}.${{ matrix.pkgtype }}"
            cp "$file" "$GITHUB_WORKSPACE/output/$release_file"
          done
          cp "$preview_file" "$GITHUB_WORKSPACE/preview-output/rill-runtime-preview-${{ matrix.branch }}-${{ matrix.package_arch }}.${{ matrix.pkgtype }}"
          preview_export="$GITHUB_WORKSPACE/preview-output/rill-runtime-preview-${{ matrix.branch }}-${{ matrix.package_arch }}.${{ matrix.pkgtype }}"
          stable_export="$GITHUB_WORKSPACE/output/rill-runtime-${{ matrix.branch }}-${{ matrix.package_arch }}.${{ matrix.pkgtype }}"
          sha256sum "$preview_export" | sed "s#  $GITHUB_WORKSPACE/preview-output/##" > "$GITHUB_WORKSPACE/preview-output/SHA256SUMS"
          sha256sum "$stable_export" | sed "s#  $GITHUB_WORKSPACE/output/##" > "$GITHUB_WORKSPACE/output/SHA256SUMS"
      - name: Generate per-target OpenWrt feed index
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDKDIR"
          package=$(find bin -type f -name "rill-runtime_[0-9]*.${{ matrix.pkgtype }}" -print -quit)
          test -n "$package"
          feed_dir="$GITHUB_WORKSPACE/feed/${{ matrix.release_version }}/${{ matrix.openwrt_target }}/${{ matrix.openwrt_subtarget }}/${{ matrix.package_arch }}"
          mkdir -p "$feed_dir"
          cp "$package" "$feed_dir/$(basename "$package")"
          case "${{ matrix.pkgtype }}" in
            ipk)
              (
                cd "$feed_dir"
                mkhash="$RUNNER_TEMP/openwrt-mkhash"
                cat > "$mkhash" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$1" = sha256
          sha256sum "$2" | awk '{print $1}'
          EOF
                chmod +x "$mkhash"
                MKHASH="$mkhash" "$SDKDIR/scripts/ipkg-make-index.sh" . > Packages.manifest
                grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch)' Packages.manifest > Packages
                gzip -9nc Packages > Packages.gz
              )
              ;;
            apk)
              test -x "$SDKDIR/staging_dir/host/bin/apk"
              (
                cd "$feed_dir"
                "$SDKDIR/staging_dir/host/bin/apk" mkndx \
                  --root "$SDKDIR" \
                  --keys-dir "$SDKDIR" \
                  --allow-untrusted \
                  --output packages.adb \
                  ./*.apk
              )
              ;;
            *)
              echo "unsupported feed package type" >&2
              exit 1
              ;;
          esac
          jq -n \
            --arg version "${{ matrix.release_version }}" \
            --arg target "${{ matrix.openwrt_target }}" \
            --arg subtarget "${{ matrix.openwrt_subtarget }}" \
            --arg packageArch "${{ matrix.package_arch }}" \
            --arg pkgtype "${{ matrix.pkgtype }}" \
            --arg signing "unsigned" \
            --arg package "rill-runtime" \
            --arg packageVersion "$(sed -n 's/^PKG_VERSION:=//p' "$GITHUB_WORKSPACE/package/rill-runtime/Makefile")-r$(sed -n 's/^PKG_RELEASE:=//p' "$GITHUB_WORKSPACE/package/rill-runtime/Makefile")" \
            --arg packageRelease "$(sed -n 's/^PKG_RELEASE:=//p' "$GITHUB_WORKSPACE/package/rill-runtime/Makefile")" \
            '{openwrtVersion:$version,target:$target,subtarget:$subtarget,packageArch:$packageArch,pkgtype:$pkgtype,package:$package,packageVersion:$packageVersion,packageRelease:($packageRelease|tonumber),signing:$signing}' \
            > "$feed_dir/feed-metadata.json"
      - name: Preserve official signing tools for promotion and transaction tests
        if: ${{ matrix.package_arch == 'x86_64' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/signing-tools/bin" "$GITHUB_WORKSPACE/signing-tools/lib"
          if [ "${{ matrix.pkgtype }}" = ipk ]; then
            test -x "$SDKDIR/staging_dir/host/bin/usign"
            test -x "$SDKDIR/staging_dir/host/bin/opkg"
            cp "$SDKDIR/staging_dir/host/bin/usign" "$GITHUB_WORKSPACE/signing-tools/bin/usign"
            cp "$SDKDIR/staging_dir/host/bin/opkg" "$GITHUB_WORKSPACE/signing-tools/bin/opkg"
            cp "$SDKDIR/staging_dir/host/bin/.usign.bin" "$GITHUB_WORKSPACE/signing-tools/bin/.usign.bin"
            cp "$SDKDIR/staging_dir/host/bin/.opkg.bin" "$GITHUB_WORKSPACE/signing-tools/bin/.opkg.bin"
          else
            test -x "$SDKDIR/staging_dir/host/bin/apk"
            cp "$SDKDIR/staging_dir/host/bin/apk" "$GITHUB_WORKSPACE/signing-tools/bin/apk"
            cp "$SDKDIR/staging_dir/host/bin/.apk.bin" "$GITHUB_WORKSPACE/signing-tools/bin/.apk.bin"
          fi
          cp -a "$SDKDIR/staging_dir/host/lib/." "$GITHUB_WORKSPACE/signing-tools/lib/"
          chmod +x "$GITHUB_WORKSPACE/signing-tools/lib/ld-linux-x86-64.so.2"
          tar -czf "$GITHUB_WORKSPACE/signing-tools-${{ matrix.pkgtype }}.tar.gz" -C signing-tools .
      - uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-${{ matrix.pkgtype }}-${{ matrix.branch }}-${{ matrix.package_arch }}-${{ github.run_id }}
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-feed-${{ matrix.pkgtype }}-${{ matrix.branch }}-${{ matrix.package_arch }}-${{ github.run_id }}
          path: feed/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-preview-${{ matrix.pkgtype }}-${{ matrix.branch }}-${{ matrix.package_arch }}-${{ github.run_id }}
          path: preview-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.package_arch == 'x86_64' }}
        with:
          name: rill-openwrt-signing-tools-${{ matrix.pkgtype }}-${{ github.run_id }}
          path: signing-tools-${{ matrix.pkgtype }}.tar.gz
          if-no-files-found: error

  preview-package-parity:
    name: Preview package parity
    if: always()
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rill-runtime-preview-*
          path: preview-artifacts
          merge-multiple: true
      - name: Require one exact Preview package for every registered target
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")'
          expected=$(python3 scripts/openwrt_targets.py --count)
          actual=$(find preview-artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) ! -name SHA256SUMS | wc -l | tr -d ' ')
          test "$actual" -eq "$expected"

  qualification-evidence:
    name: Qualification evidence
    if: always()
    needs: [upstream-version-sync, package, preview-package-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require build and version gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")'
      - uses: actions/download-artifact@v8
        with:
          pattern: rill-runtime-ipk-*-${{ github.run_id }}
          path: evidence/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: rill-runtime-apk-*-${{ github.run_id }}
          path: evidence/artifacts
          merge-multiple: true
      - name: Generate immutable provenance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' package/rill-runtime/Makefile)
          release=$(sed -n 's/^PKG_RELEASE:=//p' package/rill-runtime/Makefile)
          upstream_commit=$(jq -r '.upstream.commit' metadata/rill-runtime.json)
          archive_sha=$(jq -r '.upstream.archiveSha256' metadata/rill-runtime.json)
          assets=$(find evidence/artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) -print | sort)
          expected_count=$(python3 scripts/openwrt_targets.py --count)
          test "$(printf '%s\n' "$assets" | sed '/^$/d' | wc -l | tr -d ' ')" -eq "$expected_count"
          asset_json='[]'
          for asset in $assets; do
            base=$(basename "$asset")
            stem=${base#rill-runtime-v}
            openwrt_version=${stem%%-*}
            target_suffix=${stem#"$openwrt_version"-}
            package_arch=${target_suffix%.*}
            pkgtype=${base##*.}
            target_json=$(jq -c --arg version "$openwrt_version" --arg arch "$package_arch" --arg type "$pkgtype" '.targets[] | select(.enabled == true and .openwrtVersion == $version and .packageArch == $arch and .pkgtype == $type)' metadata/openwrt-targets.json)
            test -n "$target_json"
            openwrt_target=$(jq -r .target <<<"$target_json")
            openwrt_subtarget=$(jq -r .subtarget <<<"$target_json")
            rust_target=$(jq -r .rustTarget <<<"$target_json")
            support_tier=$(jq -r .supportTier <<<"$target_json")
            asset_json=$(jq --arg artifact "$base" --arg sha "$(sha256sum "$asset" | awk '{print $1}')" --arg openwrtVersion "$openwrt_version" --arg target "$openwrt_target" --arg subtarget "$openwrt_subtarget" --arg packageArch "$package_arch" --arg rustTarget "$rust_target" --arg pkgtype "$pkgtype" --arg supportTier "$support_tier" '. + [{artifact:$artifact,sha256:$sha,openwrtVersion:$openwrtVersion,target:$target,subtarget:$subtarget,packageArch:$packageArch,rustTarget:$rustTarget,pkgtype:$pkgtype,supportTier:$supportTier,qualificationState:"PASS",binary:"/usr/bin/rill-runtime",elfClass:"ELF64",endianness:"little",elfMachine:(if $packageArch=="x86_64" then "Advanced Micro Devices X86-64" else "AArch64" end)}]' <<<"$asset_json")
          done
          preview_commit=$(jq -r '.upstream.commit' metadata/rill-runtime-preview.json)
          preview_version=$(jq -r '.package.version' metadata/rill-runtime-preview.json)
          preview_release=$(jq -r '.package.release' metadata/rill-runtime-preview.json)
          jq -n --arg commit "$PACKAGE_COMMIT" --arg runId "$GITHUB_RUN_ID" --arg version "$version" --arg release "$release" --arg upstreamCommit "$upstream_commit" --arg archiveSha "$archive_sha" --arg previewCommit "$preview_commit" --arg previewVersion "$preview_version" --arg previewRelease "$preview_release" --argjson assets "$asset_json" \
            '{schemaVersion:2,packageCommit:$commit,runId:$runId,package:{name:"rill-runtime",version:$version,release:($release|tonumber),recipe:"package/rill-runtime/Makefile",binary:"/usr/bin/rill-runtime"},upstream:{repository:"hello-yunshu/rill-ml",tag:("v"+$version),commit:$upstreamCommit,archiveSha256:$archiveSha},previewPackage:{name:"rill-runtime-preview",version:$previewVersion,release:($previewRelease|tonumber),recipe:"package/rill-runtime-preview/Makefile",binary:"/usr/bin/rill-runtime",channel:"preview-exact-commit",upstreamCommit:$previewCommit,qualificationState:"PASS"},targets:$assets,qualificationState:"automated-qualification",releaseEligible:(all($assets[]; .qualificationState=="PASS"))}' > qualification.json
          jq empty qualification.json
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-evidence-${{ github.run_id }}
          path: qualification.json
          if-no-files-found: error

  signing-contract:
    name: Ephemeral repository signing and negative tests
    if: ${{ always() }}
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rill-openwrt-signing-tools-ipk-${{ github.run_id }}
          path: tools-archives
      - uses: actions/download-artifact@v8
        with:
          name: rill-openwrt-signing-tools-apk-${{ github.run_id }}
          path: tools-archives
      - name: Extract official signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          for archive in tools-archives/*.tar.gz; do
            tar -xzf "$archive" -C tools
          done
      - uses: actions/download-artifact@v8
        with:
          name: rill-runtime-feed-apk-v25.12.5-x86_64-${{ github.run_id }}
          path: apk-feed
      - uses: actions/download-artifact@v8
        with:
          name: rill-runtime-feed-ipk-v24.10.8-x86_64-${{ github.run_id }}
          path: ipk-feed
      - name: Verify ephemeral signatures fail closed
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/bin/usign tools/bin/apk
          chmod +x tools/bin/.usign.bin tools/bin/.apk.bin
          chmod +x tools/lib/ld-linux-x86-64.so.2
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tools/bin/usign -G -p "$work/ipk.pub" -s "$work/ipk.sec" -c 'Rill CI ephemeral IPK key'
          printf 'Package: rill-runtime\n' > "$work/Packages"
          tools/bin/usign -S -m "$work/Packages" -s "$work/ipk.sec" -x "$work/Packages.sig"
          tools/bin/usign -V -m "$work/Packages" -p "$work/ipk.pub" -x "$work/Packages.sig"
          if tools/bin/usign -V -m "$work/Packages" -p "$work/missing.pub" -x "$work/Packages.sig"; then exit 1; fi
          tools/bin/usign -G -p "$work/wrong-ipk.pub" -s "$work/wrong-ipk.sec" -c 'Rill CI wrong IPK key'
          if tools/bin/usign -V -m "$work/Packages" -p "$work/wrong-ipk.pub" -x "$work/Packages.sig"; then exit 1; fi
          cp "$work/Packages" "$work/tampered"
          printf 'tamper\n' >> "$work/tampered"
          if tools/bin/usign -V -m "$work/tampered" -p "$work/ipk.pub" -x "$work/Packages.sig"; then exit 1; fi
          openssl ecparam -name prime256v1 -genkey -noout -out "$work/apk.sec"
          openssl ec -in "$work/apk.sec" -pubout -out "$work/apk.pub" 2>/dev/null
          apk_file=$(find apk-feed -name '*.apk' -print -quit)
          test -n "$apk_file"
          apk_basename=$(basename "$apk_file")
          cp "$apk_file" "$work/$apk_basename"
          tools/bin/apk mkpkg \
            --info name:libc \
            --info version:1.0 \
            --info arch:noarch \
            --info description:'OpenWrt libc base-package test fixture' \
            --output "$work/libc-1.0.apk"
          tools/bin/apk mkndx --allow-untrusted --sign "$work/apk.sec" --output "$work/packages.adb" "$work/libc-1.0.apk" "$work/$apk_basename"
          mkdir -p "$work/root/etc/apk/keys"
          cp "$work/apk.pub" "$work/root/etc/apk/keys/rill-ci.pub"
          printf 'file://%s\n' "$work/packages.adb" > "$work/root/repositories"
          # GitHub-hosted runners forbid the package script chroot's unshare; keep
          # the transaction real while isolating this CI-only rootfs fixture.
          tools/bin/apk --root "$work/root" --usermode --no-scripts --keys-dir "$work/root/etc/apk/keys" --repositories-file "$work/root/repositories" --no-cache add --initdb rill-runtime
          test -x "$work/root/usr/bin/rill-runtime"
          tools/bin/apk --root "$work/root" --no-scripts --keys-dir "$work/root/etc/apk/keys" --repositories-file "$work/root/repositories" --no-cache del rill-runtime
          test ! -e "$work/root/usr/bin/rill-runtime"
          tools/bin/apk --root "$work/root" --keys-dir "$work/root/etc/apk/keys" --repositories-file "$work/root/repositories" --no-cache update
          rm "$work/root/etc/apk/keys/rill-ci.pub"
          if tools/bin/apk --root "$work/root" --no-scripts --keys-dir "$work/root/etc/apk/keys" --repositories-file "$work/root/repositories" --no-cache add rill-runtime; then exit 1; fi
          cp "$work/apk.pub" "$work/wrong.pub"
          openssl ecparam -name prime256v1 -genkey -noout -out "$work/wrong.sec"
          openssl ec -in "$work/wrong.sec" -pubout -out "$work/wrong.pub" 2>/dev/null
          cp "$work/wrong.pub" "$work/root/etc/apk/keys/wrong.pub"
          if tools/bin/apk --root "$work/root" --no-scripts --keys-dir "$work/root/etc/apk/keys" --repositories-file "$work/root/repositories" --no-cache add rill-runtime; then exit 1; fi
          cp "$work/apk.pub" "$work/root/etc/apk/keys/rill-ci.pub"
          cp "$work/packages.adb" "$work/tampered.adb"
          printf 'tamper' >> "$work/tampered.adb"
          printf 'file://%s\n' "$work/tampered.adb" > "$work/root/repositories"
          if tools/bin/apk --root "$work/root" --no-scripts --keys-dir "$work/root/etc/apk/keys" --repositories-file "$work/root/repositories" --no-cache add rill-runtime; then exit 1; fi
      - name: Exercise real package-manager repository transactions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/bin/opkg
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          ipk_leaf=$(realpath "$(find ipk-feed -type d -name x86_64 -print -quit)")
          test -n "$ipk_leaf"
          tools/bin/usign -G -p "$work/ipk.pub" -s "$work/ipk.sec" -c 'Rill CI ephemeral OPKG repository key'
          cat > "$work/opkg-key" <<'EOF'
          #!/bin/sh
          set -eu
          printf 'opkg-key args: %s %s %s\n' "$1" "${2:-}" "${3:-}" >> "${OPKG_KEY_LOG:?}"
          [ "$1" = verify ]
          shift
          sigfile="$1"
          msgfile="$2"
          printf 'opkg-key message: %s %s\n' "$(file -b "$msgfile")" "$(sha256sum "$msgfile" | awk '{print $1}')" >> "$OPKG_KEY_LOG"
          if gzip -t "$msgfile" 2>/dev/null; then
            gzip -dc "$msgfile"
          else
            cat "$msgfile"
          fi | "$GITHUB_WORKSPACE/tools/bin/usign" -V -P /etc/opkg/keys -x "$sigfile" -m -
          EOF
          chmod 755 "$work/opkg-key"
          export OPKG_KEY_LOG="$work/opkg-key.log"
          if [ -e /usr/sbin/opkg-key ]; then
            sudo cp -a /usr/sbin/opkg-key "$work/opkg-key.original"
          fi
          sudo install -m 755 "$work/opkg-key" /usr/sbin/opkg-key
          export PATH="$GITHUB_WORKSPACE/tools/bin:$PATH"
          mkdir -p "$work/libc-control" "$work/libc-data"
          printf '2.0\n' > "$work/debian-binary"
          cat > "$work/libc-control/control" <<'EOF'
          Package: libc
          Version: 1
          Architecture: all
          Maintainer: Rill CI
          Section: base
          Priority: optional
          Description: OpenWrt libc base-package test fixture
          EOF
          tar -czf "$work/control.tar.gz" -C "$work/libc-control" ./control
          tar -czf "$work/data.tar.gz" -C "$work/libc-data" .
          libc_ipk="$ipk_leaf/libc_1_all.ipk"
          (cd "$work" && ar rc "$libc_ipk" debian-binary control.tar.gz data.tar.gz)
          libc_size=$(stat -c %s "$libc_ipk")
          libc_sha=$(sha256sum "$libc_ipk" | awk '{print $1}')
          {
            printf '\nPackage: libc\n'
            printf 'Version: 1\nArchitecture: all\n'
            printf 'Maintainer: Rill CI\nSection: base\nPriority: optional\n'
            printf 'Filename: ./libc_1_all.ipk\nSize: %s\nSHA256sum: %s\n' "$libc_size" "$libc_sha"
            printf 'Description: OpenWrt libc base-package test fixture\n'
          } >> "$ipk_leaf/Packages"
          gzip -9nc "$ipk_leaf/Packages" > "$ipk_leaf/Packages.gz"
          tools/bin/usign -S -m "$ipk_leaf/Packages" -s "$work/ipk.sec" -x "$ipk_leaf/Packages.sig"
          tools/bin/usign -V -m "$ipk_leaf/Packages" -p "$work/ipk.pub" -x "$ipk_leaf/Packages.sig" -q

          write_opkg_conf() {
            local root="$1" leaf="$2"
            mkdir -p "$root/var/lib/opkg" "$root/tmp" "$work/empty-conf"
            cat > "$root/opkg.conf" <<EOF
          option check_signature
          arch all 1
          arch x86_64 10
          lists_dir ext $root/var/lib/opkg
          dest root $root
          src/gz rill file://$leaf
          EOF
          }

          host_key_dir=/etc/opkg/keys
          ipk_key_id=$(tools/bin/usign -F -p "$work/ipk.pub")
          host_key="$host_key_dir/$ipk_key_id"
          wrong_host_key="$host_key_dir/rill-ci-wrong-${GITHUB_RUN_ID}.pub"
          sudo mkdir -p "$host_key_dir"
          cleanup_opkg_key() {
            if [ -f "${OPKG_KEY_LOG:-}" ]; then
              cat "$OPKG_KEY_LOG"
            fi
            sudo rm -f "$host_key" "$wrong_host_key"
            if [ -e "$work/opkg-key.original" ]; then
              sudo install -m 755 "$work/opkg-key.original" /usr/sbin/opkg-key
            else
              sudo rm -f /usr/sbin/opkg-key
            fi
            rm -rf "$work"
          }
          trap cleanup_opkg_key EXIT

          good_root="$work/good-root"
          write_opkg_conf "$good_root" "$ipk_leaf"
          sudo cp "$work/ipk.pub" "$host_key"
          OPKG_CONF_DIR="$work/empty-conf" tools/bin/opkg -f "$good_root/opkg.conf" update
          OPKG_CONF_DIR="$work/empty-conf" tools/bin/opkg -f "$good_root/opkg.conf" install rill-runtime
          test -x "$good_root/usr/bin/rill-runtime"
          OPKG_CONF_DIR="$work/empty-conf" tools/bin/opkg -f "$good_root/opkg.conf" remove rill-runtime
          test ! -e "$good_root/usr/bin/rill-runtime"

          expect_opkg_reject() {
            local root="$1" reason="$2"
            OPKG_CONF_DIR="$work/empty-conf" tools/bin/opkg -f "$root/opkg.conf" update
            if OPKG_CONF_DIR="$work/empty-conf" tools/bin/opkg -f "$root/opkg.conf" install rill-runtime; then
              echo "$reason unexpectedly accepted by OPKG" >&2
              exit 1
            fi
          }

          missing_key_root="$work/missing-key-root"
          write_opkg_conf "$missing_key_root" "$ipk_leaf"
          sudo rm -f "$host_key" "$wrong_host_key"
          expect_opkg_reject "$missing_key_root" 'missing trusted key'

          tools/bin/usign -G -p "$work/wrong.pub" -s "$work/wrong.sec" -c 'Rill CI wrong OPKG repository key'
          wrong_key_root="$work/wrong-key-root"
          write_opkg_conf "$wrong_key_root" "$ipk_leaf"
          wrong_ipk_key_id=$(tools/bin/usign -F -p "$work/wrong.pub")
          wrong_host_key="$host_key_dir/$wrong_ipk_key_id"
          sudo cp "$work/wrong.pub" "$wrong_host_key"
          expect_opkg_reject "$wrong_key_root" 'wrong trusted key'

          cp -a "$ipk_leaf" "$work/tampered-packages-leaf"
          printf 'tamper\n' >> "$work/tampered-packages-leaf/Packages"
          gzip -9nc "$work/tampered-packages-leaf/Packages" > "$work/tampered-packages-leaf/Packages.gz"
          tampered_packages_root="$work/tampered-packages-root"
          write_opkg_conf "$tampered_packages_root" "$work/tampered-packages-leaf"
          sudo rm -f "$wrong_host_key"
          sudo cp "$work/ipk.pub" "$host_key"
          expect_opkg_reject "$tampered_packages_root" 'tampered Packages'

          cp -a "$ipk_leaf" "$work/tampered-gzip-leaf"
          python3 - "$work/tampered-gzip-leaf/Packages.gz" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          data[len(data) // 2] ^= 1
          path.write_bytes(data)
          PY
          tampered_gzip_root="$work/tampered-gzip-root"
          write_opkg_conf "$tampered_gzip_root" "$work/tampered-gzip-leaf"
          expect_opkg_reject "$tampered_gzip_root" 'tampered Packages.gz'
