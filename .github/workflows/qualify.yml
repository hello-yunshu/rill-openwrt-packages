name: OpenWrt package qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.pkgtype }} OpenWrt ${{ matrix.branch }} x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v24.10.5
            pkgtype: ipk
          - branch: v25.12.0
            pkgtype: apk
    container:
      image: ghcr.io/openwrt/sdk:x86_64-${{ matrix.branch }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SDK and build package
        shell: bash
        run: |
          set -euo pipefail
          cd /builder
          ./scripts/feeds update base packages
          ./scripts/feeds install rust
          for rust_makefile in feeds/packages/lang/rust/Makefile feeds/packages/lang/rust/rust-host-build.mk; do
            if [ -f "$rust_makefile" ]; then
              sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$rust_makefile"
            fi
          done
          if grep -R -n -- '--set=llvm.download-ci-llvm=true' feeds/packages/lang/rust; then
            echo 'Rust feed still enables CI LLVM downloads' >&2
            exit 1
          fi
          mkdir -p package/rill-runtime
          cp -a "$GITHUB_WORKSPACE/package/rill-runtime/." package/rill-runtime/
          echo 'CONFIG_PACKAGE_rill-runtime=y' >> .config
          make defconfig
          unset CI
          make package/rill-runtime/compile V=sc
      - name: Inspect exact package payload
        shell: bash
        run: |
          set -euo pipefail
          cd /builder
          files=$(find bin -type f -name "rill-runtime*.${{ matrix.pkgtype }}")
          test -n "$files"
          printf '%s\n' "$files" | while IFS= read -r file; do
            case "${file##*.}" in
              ipk)
                members=$(tar -tf "$file")
                data=$(printf '%s\n' "$members" | grep -E '^\./data\.tar' | head -n1)
                test -n "$data"
                tar -xOf "$file" "$data" | tar -tf - | sed 's#^\./##' | grep -Fx usr/bin/rill-runtime
                ! tar -xOf "$file" "$data" | tar -tf - | sed 's#^\./##' | grep -Eq '(^|/)rill-pack$|(^|/)rill-pack/'
                ;;
              apk)
                test -x /builder/staging_dir/host/bin/apk
                /builder/staging_dir/host/bin/apk --root "$RUNNER_TEMP/apk-root" --network=no --repositories-file /dev/null add --initdb --no-scripts
                /builder/staging_dir/host/bin/apk --root "$RUNNER_TEMP/apk-root" --allow-untrusted manifest "$file" | awk '{print $NF}' | grep -Fx usr/bin/rill-runtime
                ! /builder/staging_dir/host/bin/apk --root "$RUNNER_TEMP/apk-root" --allow-untrusted manifest "$file" | awk '{print $NF}' | grep -Eq '(^|/)rill-pack$|(^|/)rill-pack/'
                ;;
            esac
          done
