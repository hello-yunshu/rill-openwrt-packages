name: Check pinned Rill upstream source

on:
  workflow_dispatch:
  # rill-ml 发布 Stable 运行时版本后 dispatch 过来，检查钉住的 upstream
  # 是否已经落后；落后时本 job 失败即为该信号，晋升仍需人工确认。
  repository_dispatch:
    types: [rill-upstream-release]

permissions:
  contents: read

concurrency:
  group: rill-source-pin-check
  cancel-in-progress: true

jobs:
  update-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Update canonical package to the published Stable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_upstream_version.py --json
        env:
          GH_TOKEN: ${{ github.token }}
