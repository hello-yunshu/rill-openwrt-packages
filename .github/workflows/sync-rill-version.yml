name: Check Rill Stable package drift

on:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [rill-stable-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rill-stable-sync
  cancel-in-progress: false

jobs:
  update-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Update canonical package to the published Stable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_rill_version.py --json > "$RUNNER_TEMP/update.json"
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          Updates only the canonical package recipe and preserved upstream metadata.
          OpenWrt qualification must pass for this exact source before merge.
          The required exact-commit qualification is explicitly dispatched; a PR alone is not a PASS.
          EOF
          python3 scripts/open_sync_pr.py --base main --prefix automation/rill-stable \
            --title "build: sync qualified Rill Stable package source" --qualification-workflow qualify.yml \
            --body-file "$RUNNER_TEMP/body.md" \
            package/rill-runtime/Makefile metadata/rill-runtime.json
        env:
          GH_TOKEN: ${{ github.token }}
