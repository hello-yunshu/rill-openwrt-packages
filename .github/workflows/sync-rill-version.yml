name: Check pinned Rill upstream source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rill-source-pin-check
  cancel-in-progress: true

jobs:
  update-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Update canonical package to the published Stable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_upstream_version.py --json
        env:
          GH_TOKEN: ${{ github.token }}
