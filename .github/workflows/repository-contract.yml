name: Repository contract

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - 'keys/**'
      - 'metadata/**'
      - '.github/workflows/**'
      - 'README*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -v
          bash -n scripts/*.sh
