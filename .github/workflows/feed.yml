name: Publish OpenWrt package feed

on:
  workflow_run:
    workflows: [OpenWrt package qualification]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rill-openwrt-feed
  cancel-in-progress: false

jobs:
  build-feed:
    name: Build and verify exact qualified feed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      production_eligible: ${{ steps.channel.outputs.production_eligible }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: rill-runtime-feed-*
          path: feed-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: qualification-evidence
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: rill-openwrt-signing-tools-*
          path: tools
          merge-multiple: true
      - name: Assemble exact package bytes
        shell: bash
        run: |
          set -euo pipefail
          test -d feed-artifacts
          mkdir -p site/feed
          cp -a feed-artifacts/. site/feed/
          test -s evidence/qualification.json
          test -x tools/bin/usign
          test -x tools/bin/apk
          test -f tools/bin/.usign.bin
          test -f tools/bin/.apk.bin
          chmod +x tools/bin/usign tools/bin/apk
          chmod +x tools/bin/.usign.bin tools/bin/.apk.bin
          test -x tools/lib/ld-linux-x86-64.so.2
          chmod +x tools/lib/ld-linux-x86-64.so.2
      - name: Select production signing channel
        id: channel
        env:
          IPK_SIGNING_KEY: ${{ secrets.RILL_OPENWRT_IPK_SIGNING_KEY }}
          APK_SIGNING_KEY: ${{ secrets.RILL_OPENWRT_APK_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${IPK_SIGNING_KEY:-}" ] && [ -z "${APK_SIGNING_KEY:-}" ]; then
            echo 'Production signing keys are not provisioned; keeping this run development-only.'
            echo 'production_eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "${IPK_SIGNING_KEY:-}" && test -n "${APK_SIGNING_KEY:-}"
          test -s keys/rill-openwrt-feed-usign.pub
          test -s keys/rill-openwrt-feed-apk.pub
          printf '%s\n' "$IPK_SIGNING_KEY" > "$RUNNER_TEMP/rill-ipk.sec"
          printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/rill-apk.sec"
          chmod 600 "$RUNNER_TEMP/rill-ipk.sec" "$RUNNER_TEMP/rill-apk.sec"
          printf 'key-match\n' > "$RUNNER_TEMP/key-match"
          tools/bin/usign -S -m "$RUNNER_TEMP/key-match" -s "$RUNNER_TEMP/rill-ipk.sec" -x "$RUNNER_TEMP/key-match.sig"
          tools/bin/usign -V -m "$RUNNER_TEMP/key-match" -p keys/rill-openwrt-feed-usign.pub -x "$RUNNER_TEMP/key-match.sig" -q
          openssl pkey -in "$RUNNER_TEMP/rill-apk.sec" -pubout -out "$RUNNER_TEMP/rill-apk.pub"
          cmp -s "$RUNNER_TEMP/rill-apk.pub" keys/rill-openwrt-feed-apk.pub
          echo 'production_eligible=true' >> "$GITHUB_OUTPUT"
      - name: Sign feed indexes with OpenWrt-native formats
        if: ${{ steps.channel.outputs.production_eligible == 'true' }}
        env:
          IPK_SIGNING_KEY: ${{ secrets.RILL_OPENWRT_IPK_SIGNING_KEY }}
          APK_SIGNING_KEY: ${{ secrets.RILL_OPENWRT_APK_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$IPK_SIGNING_KEY" > "$RUNNER_TEMP/rill-ipk.sec"
          printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/rill-apk.sec"
          chmod 600 "$RUNNER_TEMP/rill-ipk.sec" "$RUNNER_TEMP/rill-apk.sec"
          mkdir -p "$RUNNER_TEMP/apk-root"
          python3 scripts/sign_feed.py site/feed \
            --ipk-private-key "$RUNNER_TEMP/rill-ipk.sec" \
            --apk-private-key "$RUNNER_TEMP/rill-apk.sec" \
            --usign "$GITHUB_WORKSPACE/tools/bin/usign" \
            --apk "$GITHUB_WORKSPACE/tools/bin/apk" \
            --apk-root "$RUNNER_TEMP/apk-root"
      - name: Generate durable provenance and verify feed semantics
        id: manifest
        env:
          IPK_SIGNING_KEY: ${{ secrets.RILL_OPENWRT_IPK_SIGNING_KEY }}
          APK_SIGNING_KEY: ${{ secrets.RILL_OPENWRT_APK_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          channel=development
          if [ "${{ steps.channel.outputs.production_eligible }}" = true ]; then channel=production; fi
          key_id=''
          public_args=()
          if [ "$channel" = production ]; then
            key_id="$(tools/bin/usign -F -p keys/rill-openwrt-feed-usign.pub)|$(sha256sum keys/rill-openwrt-feed-apk.pub | awk '{print $1}')"
            public_args=(--public-key keys/rill-openwrt-feed-usign.pub --apk-public-key keys/rill-openwrt-feed-apk.pub --key-id "$key_id")
            mkdir -p site/keys
            cp keys/rill-openwrt-feed-usign.pub keys/rill-openwrt-feed-apk.pub site/keys/
          fi
          python3 scripts/build_feed_manifest.py site/feed evidence/qualification.json site/feed/manifest.json --channel "$channel" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$(jq -r '.package.version' evidence/qualification.json | sed 's/^/v/')-r$(jq -r '.package.release' evidence/qualification.json)" \
            "${public_args[@]}"
          python3 scripts/verify_feed.py site/feed --channel "$channel" --manifest site/feed/manifest.json --apk tools/bin/apk \
            ${channel:+--usign tools/bin/usign} \
            ${channel:+--public-key keys/rill-openwrt-feed-usign.pub} \
            ${channel:+--apk-public-key keys/rill-openwrt-feed-apk.pub}
          mkdir -p site
          cp site/feed/manifest.json site/manifest.json
          cp evidence/qualification.json site/qualification.json
          (cd site && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > site/SHA256SUMS
          jq -e --arg channel "$channel" '.channel == $channel' site/feed/manifest.json >/dev/null
      - name: Create Pages site
        if: ${{ steps.channel.outputs.production_eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Rill OpenWrt package feed</title>
          <h1>Rill OpenWrt package feed</h1>
          <p>Signed rill-runtime packages promoted from one exact OpenWrt qualification run.</p>
          <ul><li><a href="feed/24.10.8/">OpenWrt 24.10.8 IPK</a></li><li><a href="feed/25.12.5/">OpenWrt 25.12.5 APK</a></li></ul>
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.channel.outputs.production_eligible == 'true' }}
        with:
          path: site

  deploy:
    needs: build-feed
    if: ${{ needs.build-feed.outputs.production_eligible == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
